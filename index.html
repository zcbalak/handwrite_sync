<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f5f6fa">
<title>手写笔记</title>
<style>
  :root {
    --bg: #f5f6fa;
    --panel: #ffffff;
    --ink: #1c2333;
    --dim: #7a8194;
    --line: #e6e8ef;
    --accent: #4f46e5;
    --accent-soft: #eef0ff;
    --ok: #16a34a;
    --warn: #d97706;
    --err: #dc2626;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased;
  }
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; }
  .brand-icon {
    width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center;
    background: var(--accent); color: #fff; font-size: 15px;
  }
  .chip {
    margin-left: auto; font-size: 11px; padding: 4px 10px; border-radius: 999px;
    background: var(--accent-soft); color: var(--accent); font-weight: 600;
  }
  .chip.ok { background: #e8f7ee; color: var(--ok); }
  .chip.warn { background: #fdf3e3; color: var(--warn); }
  .container { max-width: 720px; margin: 0 auto; padding: 16px 16px calc(40px + env(safe-area-inset-bottom)); }
  .hero { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .hero h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.02em; }
  .hero p { color: var(--dim); font-size: 13px; margin-top: 2px; }
  .btn-upload {
    flex: none; border: none; background: var(--accent); color: #fff; font-size: 14px; font-weight: 600;
    padding: 11px 16px; border-radius: 12px; cursor: pointer; box-shadow: 0 4px 14px rgba(79,70,229,.28);
  }
  .btn-upload:disabled { opacity: .55; cursor: not-allowed; }
  .search {
    display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 14px;
  }
  .search input { flex: 1; border: none; outline: none; background: transparent; font-size: 14px; color: var(--ink); }
  .notice { font-size: 13px; border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; line-height: 1.5; }
  .notice.info { background: var(--accent-soft); color: var(--accent); }
  .notice.err { background: #fdecec; color: var(--err); }
  .notice.ok { background: #e8f7ee; color: var(--ok); }
  .list { display: flex; flex-direction: column; gap: 10px; }
  .note {
    display: flex; gap: 12px; align-items: stretch; text-align: left; width: 100%;
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 10px; cursor: pointer; font-family: inherit; color: inherit; transition: transform .06s;
  }
  .note:active { transform: scale(.985); }
  .note img {
    flex: none; width: 76px; height: 76px; object-fit: cover; border-radius: 10px; background: #eef0f5;
  }
  .note-body { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
  .note-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .note-head strong { font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-head time { font-size: 11px; color: var(--dim); flex: none; }
  .note-body p { font-size: 12.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .note-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 2px; }
  .note-del {
    flex: none; border: 1px solid #f3d3d3; background: #fff; color: var(--err);
    border-radius: 8px; padding: 4px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .note-status { font-size: 11px; display: flex; align-items: center; gap: 5px; }
  .note-status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--dim); flex: none; }
  .note-status.synced::before { background: var(--ok); }
  .note-status.pending::before { background: var(--warn); }
  .note-status.error::before { background: var(--err); }
  .empty { text-align: center; color: var(--dim); padding: 60px 0; }
  .empty .big { font-size: 40px; display: block; margin-bottom: 10px; }
  .empty h2 { font-size: 16px; color: var(--ink); margin-bottom: 4px; }
  .empty p { font-size: 13px; }

  /* 详情 */
  .detail {
    position: fixed; inset: 0; z-index: 40; background: var(--bg);
    display: flex; flex-direction: column; overflow: hidden;
  }
  /* hidden 属性必须生效，否则详情页全屏遮罩会一直盖住列表页 */
  .detail[hidden] { display: none; }
  .detail-head {
    flex: none; display: flex; align-items: center; gap: 10px;
    padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top));
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .detail-head .back { border: none; background: var(--accent-soft); color: var(--accent); width: 34px; height: 34px; border-radius: 10px; font-size: 17px; cursor: pointer; }
  .detail-head h2 { font-size: 15px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail-head a { color: var(--accent); font-size: 12.5px; text-decoration: none; font-weight: 600; flex: none; }
  .btn-del {
    flex: none; border: 1px solid #f3d3d3; background: #fff; color: var(--err);
    border-radius: 10px; padding: 8px 12px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .btn-del:disabled { opacity: .5; cursor: not-allowed; }
  .detail-scroll {
    flex: 1; overflow-y: auto; padding: 16px 16px calc(30px + env(safe-area-inset-bottom)); -webkit-overflow-scrolling: touch;
    width: 100%; max-width: 760px; margin: 0 auto;
  }
  .detail-img { width: 100%; max-width: 600px; margin: 0 auto; display: block; border-radius: var(--radius); border: 1px solid var(--line); background: #fff; }
  .section { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-top: 12px; }
  .section h3 { font-size: 13px; color: var(--dim); font-weight: 600; margin-bottom: 10px; }
  .md { font-size: 14.5px; line-height: 1.75; word-break: break-word; }
  .md h1,.md h2,.md h3,.md h4 { margin: 14px 0 6px; line-height: 1.4; }
  .md h1 { font-size: 20px; } .md h2 { font-size: 18px; } .md h3 { font-size: 16px; }
  .md p { margin: 6px 0; }
  .md ul, .md ol { padding-left: 20px; margin: 6px 0; }
  .md li { margin: 3px 0; }
  .md code { background: #eef0f5; border-radius: 5px; padding: 1px 5px; font-size: 13px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .md pre { background: #f0f2f8; border: 1px solid var(--line); border-radius: 10px; padding: 12px; overflow-x: auto; margin: 8px 0; }
  .md pre code { background: none; padding: 0; }
  .md table { border-collapse: collapse; margin: 8px 0; width: 100%; font-size: 13.5px; }
  .md th, .md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .md th { background: #f7f8fc; }
  .md blockquote { border-left: 3px solid var(--accent); padding-left: 10px; color: var(--dim); margin: 6px 0; }
  .math { font-family: Georgia, "Times New Roman", serif; font-style: italic; }
  .math.block { display: block; text-align: center; margin: 8px 0; }
  .chat { display: flex; flex-direction: column; gap: 8px; }
  .chat-msg { padding: 8px 12px; border-radius: 12px; font-size: 13.5px; line-height: 1.55; }
  .chat-msg.user { background: var(--accent-soft); align-self: flex-end; max-width: 88%; }
  .chat-msg.ai { background: #f2f4f9; align-self: flex-start; max-width: 88%; }
  .chat-input-row { display: flex; gap: 8px; margin-top: 4px; }
  .chat-input-row textarea {
    flex: 1; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; font-size: 14px;
    font-family: inherit; resize: none; outline: none; background: var(--panel); color: var(--ink); max-height: 110px;
  }
  .chat-input-row textarea:focus { border-color: var(--accent); }
  .chat-send {
    flex: none; border: none; background: var(--accent); color: #fff; border-radius: 12px; padding: 0 16px;
    font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .chat-send:disabled { opacity: .5; cursor: not-allowed; }
  .btn-retry {
    width: 100%; margin-top: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink);
    border-radius: 12px; padding: 11px; font-size: 14px; cursor: pointer; font-family: inherit; font-weight: 600;
  }
  .btn-retry:disabled { opacity: .5; cursor: not-allowed; }

  /* 确认弹窗 */
  .modal-mask {
    position: fixed; inset: 0; z-index: 60; background: rgba(20,24,40,.45);
    display: flex; align-items: center; justify-content: center; padding: 24px;
  }
  .modal-mask[hidden] { display: none; }
  .modal {
    width: 100%; max-width: 340px; background: var(--panel); border-radius: 16px; padding: 20px;
    box-shadow: 0 12px 40px rgba(20,24,40,.25);
  }
  .modal h3 { font-size: 16px; margin-bottom: 6px; }
  .modal p { font-size: 13px; color: var(--dim); line-height: 1.6; margin-bottom: 14px; }
  .modal .row { display: flex; flex-direction: column; gap: 8px; }
  .modal button {
    border: none; border-radius: 11px; padding: 11px; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .modal .danger { background: var(--err); color: #fff; }
  .modal .danger-soft { background: #fdecec; color: var(--err); }
  .modal .cancel { background: #f2f4f9; color: var(--ink); }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="brand-icon">✎</span>手写笔记</div>
  <span class="chip" id="statusChip">连接中…</span>
</header>

<div class="container" id="mainView">
  <div class="hero">
    <div>
      <h1>我的笔记</h1>
      <p>拍照或上传，自动识别并同步到飞书</p>
    </div>
    <button class="btn-upload" id="uploadBtn">＋ 拍照 / 上传</button>
    <input type="file" id="fileInput" accept="image/*" hidden>
  </div>
  <div class="search"><span>⌕</span><input id="searchInput" placeholder="搜索标题或手写内容"></div>
  <div id="notice"></div>
  <div class="list" id="noteList"></div>
  <div class="empty" id="emptyBox" hidden><span class="big">✎</span><h2 id="emptyTitle">第一张笔记，从拍照开始</h2><p id="emptyDesc">写完后拍一张照片，原图和识别的文字都会保留下来。</p></div>
</div>

<div class="detail" id="detailView" hidden>
  <div class="detail-head">
    <button class="back" id="detailBack" aria-label="返回">‹</button>
    <h2 id="detailTitle">笔记</h2>
    <a id="feishuLink" href="#" target="_blank" rel="noopener noreferrer" hidden>在飞书中打开 ↗</a>
    <button class="btn-del" id="detailDel">删除</button>
  </div>
  <div class="detail-scroll">
    <img class="detail-img" id="detailImg" alt="笔记原图">
    <div class="section" id="markdownSection">
      <h3>整理后的 Markdown</h3>
      <article class="md" id="detailMd"></article>
    </div>
    <div class="section">
      <h3>用 DeepSeek 调整排版</h3>
      <div class="chat" id="chatThread"></div>
      <div class="chat-input-row">
        <textarea id="chatInput" rows="1" placeholder="告诉 DeepSeek 如何修改，例如：把中间的公式整理成表格" maxlength="1000"></textarea>
        <button class="chat-send" id="chatSend">修改</button>
      </div>
      <div id="syncHint"></div>
      <button class="btn-retry" id="retryBtn" hidden>重新同步到飞书</button>
    </div>
  </div>
</div>

<div class="modal-mask" id="deleteModal" hidden>
  <div class="modal">
    <h3>删除这篇笔记？</h3>
    <p id="deleteModalDesc">删除后将无法恢复。</p>
    <div class="row">
      <button class="danger" id="delBoth">同时删除飞书文档</button>
      <button class="danger-soft" id="delLocal">仅删除本地</button>
      <button class="cancel" id="delCancel">取消</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';
  const $ = (id) => document.getElementById(id);
  let config = { feishuConfigured: false, deepseekConfigured: false, kvConfigured: false };
  let notes = [];
  let selected = null;
  let busy = false;
  let chatBusy = false;
  const chatThreads = {}; // 每个笔记的对话修改历史（独立于服务端笔记对象）

  // ---- 网络层 ----
  async function api(path, options = {}) {
    const res = await fetch(path, options);
    return res;
  }
  async function apiJson(path, options = {}) {
    const res = await api(path, options);
    const body = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(body.error || '请求失败');
    return body;
  }

  async function loadConfig() {
    try {
      const res = await fetch('/api/config');
      const body = await res.json();
      config = { ...config, ...body };
    } catch (e) { /* 网络失败时保持默认 */ }
    renderStatus();
  }

  function renderStatus() {
    const chip = $('statusChip');
    if (!config.kvConfigured) { chip.textContent = '待配置'; chip.className = 'chip warn'; }
    else if (config.feishuConfigured && config.deepseekConfigured) { chip.textContent = '已连接'; chip.className = 'chip ok'; }
    else { chip.textContent = '待配置'; chip.className = 'chip warn'; }
    const notice = $('notice');
    const missing = [];
    if (!config.kvConfigured) missing.push('KV 存储未绑定（项目设置中绑定命名空间，变量名 NOTES_KV）');
    if (!config.feishuConfigured) missing.push('飞书环境变量 FEISHU_APP_ID / FEISHU_APP_SECRET');
    if (!config.deepseekConfigured) missing.push('DeepSeek API Key（DEEPSEEK_API_KEY）');
    if (missing.length) {
      notice.className = 'notice info';
      notice.innerHTML = '<b>还差几步即可使用：</b><br>' + missing.map((x) => '· ' + x).join('<br>') + '<br><span style="opacity:.75">配置完环境变量并重新部署后刷新本页即可。</span>';
    } else {
      notice.innerHTML = '';
    }
  }

  // ---- 列表 ----
  async function refresh() {
    const data = await apiJson('/api/notes');
    notes = data.notes || [];
    renderList();
    return notes;
  }

  function renderList() {
    const listEl = $('noteList');
    const emptyEl = $('emptyBox');
    const q = $('searchInput').value.trim().toLowerCase();
    const visible = notes.filter((n) => (n.title + ' ' + n.text).toLowerCase().includes(q));
    listEl.innerHTML = '';
    if (!visible.length) {
      emptyEl.hidden = false;
      $('emptyTitle').textContent = q ? '没有找到匹配的笔记' : '第一张笔记，从拍照开始';
      $('emptyDesc').textContent = q ? '换个词试试。' : '写完后拍一张照片，原图和识别的文字都会保留下来。';
      return;
    }
    emptyEl.hidden = true;
    for (const n of visible) {
      const card = document.createElement('div');
      card.className = 'note';
      card.innerHTML =
        '<img src="/api/notes/' + n.id + '/image" alt="原图" loading="lazy">' +
        '<div class="note-body">' +
          '<div class="note-head"><strong>' + esc(n.title) + '</strong><time>' + fmtDate(n.created_at) + '</time></div>' +
          '<p>' + esc((n.text || '原图已保存，等待识别文字').slice(0, 60)) + '</p>' +
          '<div class="note-foot">' +
            '<span class="note-status ' + (n.status === 'synced' ? 'synced' : n.error ? 'error' : 'pending') + '">' +
              (n.status === 'synced' ? '已同步飞书' : n.status === 'pending' ? (n.error ? '待同步 · ' + esc(n.error) : '处理中…') : '待同步') +
            '</span>' +
            '<button class="note-del">删除</button>' +
          '</div>' +
        '</div>';
      card.onclick = () => openDetail(n.id);
      card.querySelector('.note-del').onclick = (e) => { e.stopPropagation(); openDeleteModal(n); };
      listEl.appendChild(card);
    }
  }

  // ---- 上传 ----
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        try {
          // 两遍压缩：EdgeOne 函数请求体上限 1MB（base64 JSON 需留余量）
          const pass = (max, quality) => {
            let { width, height } = img;
            const scale = Math.min(1, max / Math.max(width, height));
            width = Math.round(width * scale);
            height = Math.round(height * scale);
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            canvas.getContext('2d').drawImage(img, 0, 0, width, height);
            return canvas.toDataURL('image/jpeg', quality);
          };
          let dataUrl = pass(1400, 0.72);
          if (dataUrl.length > 900 * 1024) dataUrl = pass(1000, 0.6);
          if (!dataUrl || dataUrl.length > 1000 * 1024) throw new Error('图片压缩后仍超过大小限制');
          resolve(dataUrl);
        } catch (e) { reject(new Error('图片压缩失败')); }
        finally { URL.revokeObjectURL(url); }
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('无法读取图片')); };
      img.src = url;
    });
  }

  async function upload(file) {
    if (!file || busy) return;
    busy = true;
    setBusyUI(true, '正在保存照片…');
    try {
      const compressed = await compressImage(file);
      const body = JSON.stringify({ image: compressed, filename: file.name });
      const res = await api('/api/notes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || '上传失败');
      if (data.status === 'synced') {
        notice('已保存并同步到飞书', 'ok');
      } else {
        notice('原图已保存，但尚未同步：' + (data.error || '请查看笔记详情并重试'), 'err');
      }
      await refresh();
      if (data.id) openDetail(data.id);
    } catch (e) {
      notice(e.message || '上传失败', 'err');
    } finally {
      busy = false;
      setBusyUI(false, '');
      $('fileInput').value = '';
    }
  }

  // ---- 详情 ----
  async function openDetail(id) {
    const data = await apiJson('/api/notes/' + id).catch(() => null);
    if (!data || !data.note) return;
    selected = data.note;
    chatThreads[selected.id] = chatThreads[selected.id] || [];
    $('detailView').hidden = false;
    $('detailTitle').textContent = selected.title;
    $('detailImg').src = '/api/notes/' + selected.id + '/image';
    $('detailMd').innerHTML = renderMd(selected.text || '');
    renderMath($('detailMd'));
    const link = $('feishuLink');
    if (selected.wiki_url) { link.hidden = false; link.href = selected.wiki_url; } else { link.hidden = true; }
    renderSyncHint();
    renderChatThread();
    $('chatInput').value = '';
    $('chatInput').focus();
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    $('detailView').hidden = true;
    selected = null;
    document.body.style.overflow = '';
  }

  // ---- 删除 ----
  let deleteTarget = null;
  function openDeleteModal(note) {
    deleteTarget = note || selected;
    if (!deleteTarget) return;
    const synced = deleteTarget.status === 'synced' && !!(deleteTarget.doc_id || deleteTarget.wiki_url);
    $('delBoth').hidden = !synced;
    $('deleteModalDesc').textContent = synced
      ? '删除后将无法恢复。这篇笔记已同步到飞书，是否同时删除飞书文档？'
      : '删除后将无法恢复。';
    $('deleteModal').hidden = false;
  }
  function closeDeleteModal() { $('deleteModal').hidden = true; }

  async function doDelete(sync) {
    if (!deleteTarget) return;
    const id = deleteTarget.id;
    closeDeleteModal();
    busy = true;
    setBusyUI(true, '正在删除…');
    try {
      await apiJson('/api/notes/' + id + '?sync=' + (sync ? 1 : 0), { method: 'DELETE' });
      notice(sync ? '已删除，飞书文档也已删除' : '已删除', 'ok');
      if (selected && selected.id === id) closeDetail();
      await refresh();
    } catch (e) {
      notice(e.message || '删除失败，请重试', 'err');
    } finally {
      busy = false;
      setBusyUI(false, '');
      deleteTarget = null;
    }
  }

  function renderSyncHint() {
    const hint = $('syncHint');
    const retry = $('retryBtn');
    if (!selected) return;
    if (selected.status === 'synced') {
      hint.innerHTML = '';
      retry.hidden = true;
    } else {
      hint.className = 'notice err';
      hint.innerHTML = selected.error ? '尚未同步飞书：' + esc(selected.error) : '正在处理…';
      retry.hidden = false;
      retry.disabled = busy;
      retry.textContent = busy ? '正在同步…' : '重新同步到飞书';
    }
  }

  // 对话修改排版（聊天线程）
  function renderChatThread() {
    const thread = $('chatThread');
    thread.innerHTML = '';
    const msgs = (selected && chatThreads[selected.id]) || [];
    for (const m of msgs) {
      const div = document.createElement('div');
      div.className = 'chat-msg ' + m.role;
      div.textContent = m.text;
      thread.appendChild(div);
    }
    $('chatSend').disabled = chatBusy || !selected || selected.status !== 'synced';
  }

  async function sendRevise() {
    const text = $('chatInput').value.trim();
    if (!text || chatBusy || !selected || selected.status !== 'synced') return;
    chatBusy = true;
    $('chatInput').value = '';
    const thread = (chatThreads[selected.id] = chatThreads[selected.id] || []);
    thread.push({ role: 'user', text });
    thread.push({ role: 'ai', text: '正在修改并同步到飞书…' });
    renderChatThread();
    try {
      const data = await apiJson('/api/notes/' + selected.id + '/revise', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ instruction: text }),
      });
      thread.pop();
      selected.text = data.text || selected.text;
      thread.push({ role: 'ai', text: data.unchanged ? '内容无需修改' : '已按要求更新，正文和飞书文档已同步。' });
      $('detailMd').innerHTML = renderMd(selected.text || '');
      renderMath($('detailMd'));
      await refresh();
      const fresh = notes.find((n) => n.id === selected.id);
      if (fresh) selected = fresh;
    } catch (e) {
      thread.pop();
      thread.push({ role: 'ai', text: '修改失败：' + (e.message || '请重试') });
    } finally {
      chatBusy = false;
      renderChatThread();
    }
  }

  async function retrySync() {
    if (!selected || busy) return;
    busy = true;
    setBusyUI(true, '正在重新同步到飞书…');
    try {
      const data = await apiJson('/api/notes/' + selected.id + '/retry', { method: 'POST' });
      if (data.status === 'synced') notice('已同步到飞书', 'ok');
      else notice(data.error || '仍未同步，请稍后重试', 'err');
      await refresh();
      const fresh = notes.find((n) => n.id === selected.id);
      if (fresh) selected = fresh;
      renderSyncHint();
      $('detailMd').innerHTML = renderMd(selected.text || '');
      renderMath($('detailMd'));
      const link = $('feishuLink');
      if (selected.wiki_url) { link.hidden = false; link.href = selected.wiki_url; }
    } catch (e) {
      notice(e.message || '重试失败，请稍后再试', 'err');
    } finally {
      busy = false;
      setBusyUI(false, '');
      renderSyncHint();
    }
  }

  // ---- 工具 ----
  function notice(text, type) {
    const el = $('notice');
    el.className = 'notice ' + (type || 'info');
    el.textContent = text;
  }
  function setBusyUI(b, text) {
    $('uploadBtn').disabled = b;
    $('uploadBtn').textContent = b ? text : '＋ 拍照 / 上传';
  }
  function fmtDate(iso) {
    try { return new Date(iso).toLocaleDateString('zh-CN'); } catch (e) { return ''; }
  }
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  // ---- Markdown 渲染（含数学）----
  function renderMd(text) {
    let html = text.replace(/\r\n?/g, '\n');
    // 代码块保护
    const fences = [];
    html = html.replace(/```([\s\S]*?)```/g, function (_, code) {
      fences.push(code);
      return '```' + (fences.length - 1) + '```';
    });
    // 数学保护（块级 $$...$$）
    const mathBlocks = [];
    html = html.replace(/\$\$([\s\S]+?)\$\$/g, function (_, m) {
      mathBlocks.push(m.trim());
      return '⟦MATH' + (mathBlocks.length - 1) + '⟧';
    });
    const lines = html.split('\n');
    const out = [];
    let list = null;
    const closeList = () => { if (list) { out.push(list); list = null; } };
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      const trimmed = line.trim();
      if (!trimmed) { closeList(); out.push(''); continue; }
      const tableMatch = /^\|.*\|$/.test(trimmed) && i + 1 < lines.length && /^\|?[\s:|-]+\|?$/.test(lines[i + 1].trim()) && /-{3,}/.test(lines[i + 1]);
      if (tableMatch) {
        closeList();
        const header = trimmed.replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((x) => x.trim());
        const rows = [];
        i += 2;
        while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
          rows.push(lines[i].trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map((x) => x.trim()));
          i++;
        }
        i--;
        let t = '<div class="table-wrap"><table><thead><tr>' + header.map((h) => '<th>' + inlineMd(h) + '</th>').join('') + '</tr></thead><tbody>';
        for (const row of rows) t += '<tr>' + row.map((c) => '<td>' + inlineMd(c) + '</td>').join('') + '</tr>';
        t += '</tbody></table></div>';
        out.push(t);
        continue;
      }
      const heading = /^(#{1,6})\s+(.+)$/.exec(trimmed);
      if (heading) { closeList(); out.push('<h' + heading[1].length + '>' + inlineMd(heading[2]) + '</h' + heading[1].length + '>'); continue; }
      const quote = /^>\s?(.*)$/.exec(trimmed);
      if (quote) { closeList(); out.push('<blockquote>' + inlineMd(quote[1]) + '</blockquote>'); continue; }
      const bullet = /^[-*+]\s+(.+)$/.exec(trimmed);
      if (bullet) {
        if (!list || list.tag !== 'ul') { closeList(); list = { tag: 'ul', items: [] }; }
        list.items.push(bullet[1]);
        continue;
      }
      const ordered = /^\d+[.)]\s+(.+)$/.exec(trimmed);
      if (ordered) {
        if (!list || list.tag !== 'ol') { closeList(); list = { tag: 'ol', items: [] }; }
        list.items.push(ordered[1]);
        continue;
      }
      closeList();
      out.push('<p>' + inlineMd(trimmed) + '</p>');
    }
    closeList();
    let result = out.join('\n');
    // 还原数学块
    result = result.replace(/⟦MATH(\d+)⟧/g, function (_, idx) {
      return '<span class="math block" data-latex="' + esc(mathBlocks[Number(idx)]) + '">' + esc(mathBlocks[Number(idx)]) + '</span>';
    });
    // 还原代码块
    result = result.replace(/```(\d+)```/g, function (_, idx) {
      return '<pre><code>' + esc(fences[Number(idx)]) + '</code></pre>';
    });
    return result;
  }

  function inlineMd(s) {
    let t = esc(s);
    t = t.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    t = t.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    t = t.replace(/`([^`]+)`/g, '<code>$1</code>');
    t = t.replace(/\$([^$\n]+)\$/g, '<span class="math" data-latex="$1">$1</span>');
    return t;
  }

  function renderMath(root) {
    const spans = root.querySelectorAll('.math[data-latex]');
    for (const span of spans) {
      const latex = span.getAttribute('data-latex');
      if (window.katex) {
        try { katex.render(latex, span, { throwOnError: false, displayMode: span.classList.contains('block') }); span.removeAttribute('data-latex'); }
        catch (e) { /* 保留文本 */ }
      }
    }
  }

  // ---- 事件 ----
  $('uploadBtn').onclick = () => $('fileInput').click();
  $('fileInput').onchange = (e) => upload(e.target.files && e.target.files[0]);
  $('searchInput').oninput = () => renderList();
  $('detailBack').onclick = closeDetail;
  $('detailDel').onclick = openDeleteModal;
  $('delBoth').onclick = () => doDelete(true);
  $('delLocal').onclick = () => doDelete(false);
  $('delCancel').onclick = closeDeleteModal;
  $('chatSend').onclick = sendRevise;
  $('chatInput').onkeydown = (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendRevise(); }
  };
  $('retryBtn').onclick = retrySync;

  // 加载 KaTeX（失败则数学以文本显示）
  (function loadKatex() {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js';
    s.onerror = () => {};
    document.head.appendChild(s);
    const l = document.createElement('link');
    l.rel = 'stylesheet';
    l.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css';
    document.head.appendChild(l);
  })();

  async function init() {
    await loadConfig();
    try { await refresh(); } catch (e) { notice(e.message || '笔记暂时无法读取', 'err'); }
  }
  init();
})();
</script>
